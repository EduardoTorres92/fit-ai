<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>FIT.AI — Seu personal com IA</title>
  <meta name="description" content="FIT.AI: monte seu plano de treino, acompanhe sua evolução e tire dúvidas com um Coach AI disponível 24h.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icone-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tema-escuro.css">
  <script>(function(){try{var t=localStorage.getItem("fitai-tema")||"escuro",e=t==="escuro"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.tema=e?"escuro":"claro";var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=e?"#0b0b0d":"#000000"}catch(_){}})()</script>
</head>
<body>
  <div class="device">
    <aside id="sidebar" class="sidebar" aria-label="Navegação principal" hidden>
      <a class="sb-logo" href="#/home" aria-label="FIT.AI, início"><span class="logo-txt dark">Fit.ai</span></a>
      <nav class="sb-links" id="sb-links"></nav>
      <button type="button" class="sb-coach" data-open-chat><img src="assets/sparkles-white.svg" width="20" height="20" alt=""><span>Falar com o Coach AI</span></button>
      <p class="sb-credit">Projeto de portfólio · desenvolvido por Eduardo</p>
    </aside>
    <main id="app" class="app" aria-live="polite"></main>
    <nav id="toolbar" class="toolbar" aria-label="Navegação principal" hidden>
      <button type="button" class="tb-menu" id="tb-menu" aria-haspopup="dialog" aria-expanded="false" aria-label="Abrir navegação">
        <svg class="tb-menu-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
        <span id="tb-atual">Início</span>
      </button>
      <button type="button" class="tb-ai" data-open-chat aria-label="Abrir Coach AI">
        <img src="assets/sparkles-white.svg" width="24" height="24" alt="">
      </button>
    </nav>
    <div id="chat-layer" class="chat-layer" hidden>
      <div class="chat-backdrop" data-close-chat></div>
      <section class="chat-sheet" role="dialog" aria-modal="true" aria-label="Coach AI">
        <header class="chat-head">
          <div class="coach">
            <span class="coach-avatar"><img src="assets/sparkles-blue.svg" width="18" height="18" alt=""></span>
            <span class="coach-txt"><strong id="chat-nome">Coach AI</strong><span class="online"><img src="assets/dot-online.svg" width="8" height="8" alt="">Online</span></span>
          </div>
          <button type="button" class="icon-btn" data-close-chat aria-label="Fechar chat"><img src="assets/x.svg" width="24" height="24" alt=""></button>
        </header>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-foot">
          <div class="chips" id="chat-chips"></div>
          <form class="composer" id="chat-form" autocomplete="off">
            <input type="text" id="chat-input" placeholder="Digite sua mensagem" aria-label="Mensagem para o Coach AI">
            <button type="submit" class="send" aria-label="Enviar"><img src="assets/arrow-up.svg" width="20" height="20" alt=""></button>
          </form>
        </div>
      </section>
    </div>
  </div>
  <p class="credit">FIT.AI · projeto de portfólio · desenvolvido por Eduardo</p>
  <script src="vendor/supabase.js"></script>
  <!-- Treino da Fera (calistenia); sem ele o app usa o programa de exemplo do app.js -->
  <script src="programa-pessoal.js" onerror="this.remove()"></script>
  <script src="insanity.js"></script>
  <script src="insanity-estrutura.js"></script>
  <script src="insanity60.js"></script>
  <script src="academia.js"></script>
  <script src="calistenia21.js"></script>
  <script src="corrida.js"></script>
  <script src="guia-alimentacao.js"></script>
  <script src="circular-nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
