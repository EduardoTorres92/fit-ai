name: importar-fotos
on:
  push:
    branches: [fotos-import]
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: deploy-hostinger, path: app }
      - uses: actions/checkout@v4
        with: { ref: fotos-import, path: imp }
      - name: Baixar e converter
        run: |
          python3 -m pip install -q pillow
          mkdir -p app/public/assets/cards /tmp/f
          : > /tmp/log
          while read nome url; do
            [ -z "$nome" ] && continue
            code=$(curl -sS -L -A "curl/8.5.0" -o "/tmp/f/$nome.bin" -w "%{http_code} %{content_type}" "$url" || echo "curl-falhou")
            echo "$nome $code $(head -c 120 /tmp/f/$nome.bin | tr -dc '[:print:]')" >> /tmp/log
          done < imp/fotos.txt
          python3 - <<'PY'
          import os
          from PIL import Image
          log = open("/tmp/log").read().splitlines()
          out = []
          for linha in log:
              nome = linha.split()[0]
              try:
                  im = Image.open(f"/tmp/f/{nome}.bin").convert("RGB")
                  im.thumbnail((1200, 1200))
                  im.save(f"app/public/assets/cards/{nome}.jpg", "JPEG", quality=80, optimize=True, progressive=True)
                  out.append(f"ok {nome} {im.size}")
              except Exception as e:
                  out.append(f"erro {linha[:300]}")
          open("app/public/assets/cards/importacao.log", "w").write("\n".join(out) + "\n")
          print("\n".join(out))
          PY
      - name: Commit
        working-directory: app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/cards
          git commit -m "Fotos novas dos cards (importadas do Figma)" || exit 0
          git push origin deploy-hostinger
