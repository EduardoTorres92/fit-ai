name: listar-gifs
on:
  push:
    branches: [gifs-import]
    paths: [tools/listar.py]
permissions:
  contents: write
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/listar.py | tee listar.log
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista3.json listar.log; git commit -m "Lista dos GIFs" || exit 0; git push origin HEAD:gifs-import
