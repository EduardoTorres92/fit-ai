<section class="horarios secao" id="horarios">
  <div class="miolo horarios__miolo">
    <header class="secao__cabeca horarios__cabeca">
      <h2 class="titulo"><span class="mascara"><span class="sobe">A sua semana,</span></span><span class="mascara"><span class="sobe" style="--i:1">montada no chat</span></span></h2>
      <p class="secao__sub marco" style="--i:2">Um exemplo de semana do programa Corrida e Híbrido: o Coach mistura corrida e força nos dias que você escolheu e ajusta tudo pela sua evolução.</p>
      <span class="vaga vaga--horarios" data-vaga="horarios" data-forma="cronometro"></span>
    </header>
    <div class="grade marco" style="--i:2">
      <div class="grade__dias" role="tablist" aria-label="Dia da semana">
        <button class="grade__dia" type="button" role="tab" data-dia="seg">Seg</button>
        <button class="grade__dia" type="button" role="tab" data-dia="ter">Ter</button>
        <button class="grade__dia" type="button" role="tab" data-dia="qua">Qua</button>
        <button class="grade__dia" type="button" role="tab" data-dia="qui">Qui</button>
        <button class="grade__dia" type="button" role="tab" data-dia="sex">Sex</button>
        <button class="grade__dia" type="button" role="tab" data-dia="sab">Sáb</button>
      </div>
      <ol class="grade__aulas" role="tabpanel" aria-live="polite"></ol>
    </div>
  </div>
</section>
