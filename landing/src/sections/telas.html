<section class="telas secao" id="planos">
  <div class="miolo">
    <header class="secao__cabeca telas__cabeca">
      <h2 class="titulo"><span class="mascara"><span class="sobe">Por dentro</span></span><span class="mascara"><span class="sobe" style="--i:1">do app</span></span></h2>
      <p class="secao__sub marco" style="--i:2">Telas de verdade do FIT.AI no celular. Por enquanto, é tudo gratuito.</p>
      <span class="vaga vaga--telas" data-vaga="telas" data-forma="kettlebell" data-pose="10 -24 0"></span>
    </header>
    <div class="telas__trilho">
      <figure class="tela marco" style="--i:0">
        <div class="tela__moldura"><img src="./telas/coach.webp" alt="Chat do Coach AI respondendo quanto falta para o próximo nível" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Coach AI</b><span>Responde com os seus números: XP, cargas e o treino de hoje.</span></figcaption>
      </figure>
      <figure class="tela marco" style="--i:1">
        <div class="tela__moldura"><img src="./telas/nivel.webp" alt="Card de nível com a classe Guerreiro e a etapa da trilha" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Nível e trilha</b><span>Nível, classe e a etapa da trilha, com formatura.</span></figcaption>
      </figure>
      <figure class="tela marco" style="--i:2">
        <div class="tela__moldura"><img src="./telas/treino.webp" alt="Exercício de agachamento com a animação de execução certa" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Treino com animação</b><span>Cada série anotada, com a execução certa e a errada.</span></figcaption>
      </figure>
      <figure class="tela marco" style="--i:3">
        <div class="tela__moldura"><img src="./telas/conquistas.webp" alt="Grade de conquistas ganhas e em andamento" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Conquistas</b><span>46 medalhas, do primeiro treino à meia maratona.</span></figcaption>
      </figure>
      <figure class="tela marco" style="--i:4">
        <div class="tela__moldura"><img src="./telas/grupo.webp" alt="Ranking da semana do grupo com os níveis de cada pessoa" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Grupo</b><span>Ranking da semana e meta coletiva com os amigos.</span></figcaption>
      </figure>
      <figure class="tela marco" style="--i:5">
        <div class="tela__moldura"><img src="./telas/home.webp" alt="Tela inicial com o treino de hoje e o envio do print da corrida" width="600" height="1298" loading="lazy" decoding="async"></div>
        <figcaption><b>Início</b><span>O treino do dia e o print da corrida a um toque.</span></figcaption>
      </figure>
    </div>
  </div>
</section>
