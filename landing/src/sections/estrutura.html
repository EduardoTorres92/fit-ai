<section class="estrutura secao" id="estrutura">
  <div class="miolo">
    <header class="secao__cabeca estrutura__cabeca">
      <h2 class="titulo"><span class="mascara"><span class="sobe">Seis trilhas,</span></span><span class="mascara"><span class="sobe" style="--i:1">um XP só</span></span></h2>
      <span class="vaga vaga--estrutura" data-vaga="estrutura" data-forma="bola"></span>
    </header>
    <div class="estrutura__fotos">
      <figure class="foto marco" style="--i:0">
        <div class="foto__quadro"><img src="./fotos/corrida.webp" alt="Corredor em treino de pista" width="900" height="1125" loading="lazy" decoding="async"></div>
        <figcaption>Corrida e híbrido</figcaption>
      </figure>
      <figure class="foto foto--alta marco" style="--i:1">
        <div class="foto__quadro"><img src="./fotos/academia.webp" alt="Treino de costas na academia" width="900" height="1200" loading="lazy" decoding="async"></div>
        <figcaption>Academia</figcaption>
      </figure>
      <figure class="foto marco" style="--i:2">
        <div class="foto__quadro"><img src="./fotos/calistenia.webp" alt="Barra fixa ao ar livre" width="900" height="1125" loading="lazy" decoding="async"></div>
        <figcaption>Calistenia</figcaption>
      </figure>
    </div>
    <dl class="estrutura__numeros">
      <div class="marco" style="--i:0"><dt>6</dt><dd>trilhas: Insanos, Academia, Calistenia, Cross, Híbridos e Corrida</dd></div>
      <div class="marco" style="--i:1"><dt>187</dt><dd>exercícios que o Coach usa para montar o seu plano</dd></div>
      <div class="marco" style="--i:2"><dt>100+</dt><dd>animações de execução, muitas com o certo e o errado</dd></div>
      <div class="marco" style="--i:3"><dt>46</dt><dd>conquistas, da primeira série à meia maratona</dd></div>
    </dl>
  </div>
</section>
