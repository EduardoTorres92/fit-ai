<section class="estrutura secao" id="estrutura">
  <div class="miolo">
    <header class="secao__cabeca estrutura__cabeca">
      <h2 class="titulo"><span class="mascara"><span class="sobe">Espaço de sobra</span></span><span class="mascara"><span class="sobe" style="--i:1">para treinar pesado</span></span></h2>
      <span class="vaga vaga--estrutura" data-vaga="estrutura" data-forma="bola"></span>
    </header>
    <div class="estrutura__fotos">
      <figure class="foto marco" style="--i:0">
        <div class="foto__quadro"><img src="./fotos/salao.webp" alt="Salão de musculação com fileiras de máquinas" width="900" height="1125" loading="lazy" decoding="async"></div>
        <figcaption>Salão de musculação</figcaption>
      </figure>
      <figure class="foto foto--alta marco" style="--i:1">
        <div class="foto__quadro"><img src="./fotos/peso-livre.webp" alt="Aluna fazendo levantamento terra na área de peso livre" width="900" height="1200" loading="lazy" decoding="async"></div>
        <figcaption>Área de peso livre</figcaption>
      </figure>
      <figure class="foto marco" style="--i:2">
        <div class="foto__quadro"><img src="./fotos/tatame.webp" alt="Treino de boxe no tatame, com sacos de pancada ao fundo" width="900" height="1125" loading="lazy" decoding="async"></div>
        <figcaption>Tatame e sacos</figcaption>
      </figure>
    </div>
    <dl class="estrutura__numeros">
      <div class="marco" style="--i:0"><dt>1.200 m²</dt><dd>de salão, em dois andares</dd></div>
      <div class="marco" style="--i:1"><dt>96</dt><dd>aparelhos e estações</dd></div>
      <div class="marco" style="--i:2"><dt>3</dt><dd>salas de aula e um tatame</dd></div>
      <div class="marco" style="--i:3"><dt>18 h</dt><dd>aberta por dia, de segunda a sexta</dd></div>
    </dl>
  </div>
</section>
